name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Roda semanalmente: pega dependencia vulneravel mesmo sem PR novo.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Lint (ruff, inclui bandit rules "S")
        run: ruff check .

      - name: Auditoria de dependencias (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Testes (suite usa sqlite isolado, ver app/tests/conftest.py)
        env:
          ENV: development
          SECRET_KEY: ci-only-not-a-real-secret-000000000000
          DATABASE_URL: sqlite:///./ci.db
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_STORAGE_URI: memory://
        run: pytest -q

      - name: Import check (a app sobe?)
        env:
          ENV: development
          SECRET_KEY: ci-only-not-a-real-secret-000000000000
          DATABASE_URL: sqlite:///./ci.db
        run: python -c "from app.main import app; print('ok', len(app.routes), 'rotas')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Auditoria de dependencias (npm)
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
