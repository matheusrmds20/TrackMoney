[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions", "web", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "S"]
# S101: assert em testes. S105/S106: constantes de teste/placeholder (marcadas no local).
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
# alembic/env.py precisa importar os models para popular Base.metadata.
"alembic/env.py" = ["F401"]

[tool.pytest.ini_options]
# Garante que a raiz do repo entre no sys.path, assim `import app` funciona
# mesmo rodando o pytest de dentro de app/tests (o pacote app e regular,
# com __init__.py, mas o rootdir ainda precisa estar no path).
pythonpath = ["."]
testpaths = ["app/tests"]
